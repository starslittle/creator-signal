<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知创 · 创作者信号</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="logo">知</span><div><b>知创<span>CREATOR SIGNAL</span></b><p>创作者公开信号</p></div></div><span class="badge"><i></i>本地分析</span></header>
<main>
<section id="start"><div class="eyebrow">BILIBILI / 公开内容</div><h1>找到线索，看清依据。</h1><p class="intro">从 UP 主公开文字中，识别合作线索与明确声明。</p>
<div class="creator-card" id="creator"><span class="avatar">UP</span><div class="creator-info"><small id="creator-state">当前页面</small><strong id="creator-name">正在识别创作者…</strong><p id="creator-detail">仅支持 B站 UP 主个人空间</p></div><span class="ready-mark" aria-hidden="true">✓</span></div>
<div class="field-heading">选择分析范围</div>
<div class="modes"><label><input type="radio" name="mode" value="page" checked><span><b>主页内容</b><small>简介与已加载标题</small></span></label><label><input type="radio" name="mode" value="selection"><span><b>选中文字</b><small id="selection-hint">先在主页选择文字</small></span></label></div>
<p id="mode-help" class="helper">仅分析当前页面已显示的文字，每条结论附原文来源。</p>
<div id="selection-confirm" hidden><p id="selection-preview" class="preview"></p><label class="confirm"><input type="checkbox" id="public-confirm">我确认选文由本页 UP 主公开发布，不含评论、私信或他人内容。</label></div>
<button class="primary" id="analyze" disabled>开始分析 <span>→</span></button><div class="privacy"><span>内容留在本机</span><span>无需配置</span><span>只读页面</span></div>
</section>
<div id="status" role="alert" aria-live="polite"></div>
<div class="recovery" id="recovery" hidden><button class="secondary" id="retry">重新识别</button><a href="https://www.bilibili.com/" target="_blank" rel="noopener noreferrer">打开 B站 ↗</a></div>
<section id="result" hidden></section>
<div id="notice" role="status" aria-live="polite"></div>
<details id="history"><summary><span>最近分析 <b id="history-count">0</b></span><span class="summary-hint">保存在本机</span></summary><div id="history-items"></div><button class="text-button" id="clear-history">清空报告记录</button><div id="clear-confirm" class="clear-confirm" hidden role="group" aria-label="清空报告确认"><p id="clear-question"></p><div><button class="secondary" id="cancel-clear">取消</button><button class="secondary danger" id="confirm-clear">确认清空</button></div></div></details>
<footer><span>让每个判断，都有迹可循。</span><span>知创 · B站专版</span></footer>
</main><script type="module" src="app.js"></script></body></html>
